name: Gerar APK Automático

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar o Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Dar permissão ao Gradle
      run: chmod +x gradlew

    - name: Criar diretórios necessários
      run: mkdir -p ~/.gradle

    - name: Configurar gradle.properties
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m" > ~/.gradle/gradle.properties
        echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
        echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

    - name: Compilar o APK de Debug
      run: ./gradlew clean assembleDebug --stacktrace

    - name: Verificar se o APK foi gerado
      run: ls -la app/build/outputs/apk/debug/ || echo "Diretório não encontrado"

    - name: Salvar o arquivo APK pronto
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Jogo-Porco-Clicker
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Notificar erro na compilação
      if: failure()
      run: echo "❌ Falha na compilação do APK"

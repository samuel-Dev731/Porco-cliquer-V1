name: Compilar APK do Jogo

on:
  push:
    branches: [ main, master ] # Roda toda vez que você atualiza o código do jogo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixando o código do Jogo
      uses: actions/checkout@v4

    - name: Configurando o ambiente Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle' # Deixa as próximas compilações muito mais rápidas

    - name: Dar permissão ao Gradle (se necessário)
      run: chmod +x ./gradlew || true

    - name: Compilando o APK de Teste (Debug)
      run: ./gradlew assembleDebug

    - name: Salvar o APK pronto para baixar
      uses: actions/upload-artifact@v4
      with:
        name: Jogo-GamingOS-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
